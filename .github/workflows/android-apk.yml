name: Build LifeOS APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Готовый APK кладём на страницу Releases: его скачивают одним нажатием, без архива
      - name: Publish APK to Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LifeOS.apk
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          gh release create "build-${{ github.run_number }}" LifeOS.apk \
            --title "LifeOS, сборка ${{ github.run_number }}" \
            --notes "Готовый APK. Скачайте LifeOS.apk, откройте на телефоне и установите поверх старой версии." \
            --target "$sha" --latest
