name: Build LifeOS APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Облако (вход в аккаунт, синхронизация, ИИ по аккаунту): содержимое google-services.json хранится в секрете GOOGLE_SERVICES_JSON
      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f ci/fake-firebase ]; then
            cp ci/fake-google-services.json app/google-services.json
            echo "Проверочная сборка с фальшивым Firebase (не публикуется)"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase подключён"
          else
            echo "Firebase не настроен: приложение соберётся в локальном режиме"
          fi

      - name: Build APK
        env:
          # Необязательно: адрес бесплатного сервера ИИ (Settings → Secrets and variables → Actions → Variables)
          AI_RELAY_URL: ${{ vars.AI_RELAY_URL }}
          AI_RELAY_TOKEN: ${{ vars.AI_RELAY_TOKEN }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Check Firebase was applied
        if: ${{ hashFiles('app/google-services.json') != '' }}
        run: |
          f=$(find app/build -path '*google-services*' -name values.xml | head -1)
          test -n "$f" && grep -q google_app_id "$f" && echo "Firebase подключён к сборке: $f"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Русская модель речи (около 45 МБ): один раз выкладываем на Releases, оттуда её скачивает приложение
      - name: Mirror speech model to Releases (once)
        if: ${{ hashFiles('ci/fake-firebase') == '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view vosk-model-ru > /dev/null 2>&1; then
            curl -fL --retry 3 -o vosk-model-small-ru-0.22.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
            sha="${{ github.event.pull_request.head.sha || github.sha }}"
            gh release create vosk-model-ru vosk-model-small-ru-0.22.zip \
              --title "Русская модель речи (Vosk)" \
              --notes "Модель для офлайн-распознавания (лицензия Apache 2.0, проект Vosk). Приложение скачивает её само." \
              --target "$sha" --latest=false
          fi

      # Готовый APK кладём на страницу Releases: его скачивают одним нажатием, без архива
      - name: Publish APK to Releases
        if: ${{ hashFiles('ci/fake-firebase') == '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LifeOS.apk
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          gh release create "build-${{ github.run_number }}" LifeOS.apk \
            --title "LifeOS, сборка ${{ github.run_number }}" \
            --notes "Готовый APK. Скачайте LifeOS.apk, откройте на телефоне и установите поверх старой версии." \
            --target "$sha" --latest
